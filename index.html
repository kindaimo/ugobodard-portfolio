<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Lavishly+Yours&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="character-background">
        <canvas id="character-base"></canvas>
        <canvas id="character-hover"></canvas>
    </div>

    <div class="custom-cursor"></div>

    <header>
        <nav>
            <a href="index.html" class="logo">
                <img src="images/assets/UB Logo.png" alt="Ugo Bodard Signature">
            </a>

            <ul class="nav-links">
                <li><a href="#collections">Collections</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <div class="intro">

            <section class="hero">
                <div class="hero-title">
                    <img
                        src="images/assets/UB Title.png"
                        alt="Ugo Bodard"
                        class="hero-logo"
                    >
                </div>
            </section>

            <div class="featured">

                <div class="container">

                    <a href="collections/human-form.html?artwork=8" aria-label="View artwork 8 in Human Form">
                        <img
                            src="images/Hero1.jpg"
                            alt="Featured Artwork — view in Human Form"
                        >
                    </a>

                </div>

            </div>

        </div>

        <section class="collections" id="collections">

            <div class="container">

                <!-- Human Form -->
                <a href="collections/human-form.html" class="collection-card">

                    <img class="human-form-image"
                        src="images/Webp/Human Form/H10.webp"
                        alt="Human Form Collection">

                    <div class="overlay"></div>

                    <div class="card-content">

                        <h3>Human Form</h3>

                        <span>→</span>

                    </div>

                </a>

                <!-- Fine Line -->
                <a href="collections/fine-line.html" class="collection-card">

                    <img class="fine-line-image"
                        src="images/Webp/Fine Line/F4.webp"
                        alt="Fine Line Collection">

                    <div class="overlay"></div>

                    <div class="card-content">

                        <h3>Fine Line</h3>

                        <span>→</span>

                    </div>

                </a>

                <!-- Plants -->
                <a href="collections/plants.html" class="collection-card">

                    <img class="plants-image"
                        src="images/Webp/Plants/P5.webp"
                        alt="Plants Collection">

                    <div class="overlay"></div>

                    <div class="card-content">

                        <h3>Plants</h3>

                        <span>→</span>

                    </div>

                </a>

                <!-- Cosmopolitan -->
                <a href="collections/cosmopolitan.html" class="collection-card">

                    <img class="cosmopolitan-image"
                        src="images/Webp/Cosmopolitan/C7.webp"
                        alt="Cosmopolitan Collection">

                    <div class="overlay"></div>

                    <div class="card-content">

                        <h3>Cosmopolitan</h3>

                        <span>→</span>

                    </div>

                </a>

            </div>

        </section>

        <section class="about" id="about">

            <div class="container">

            </div>

        </section>

    </main>

    <footer id="contact">

    </footer>

    <script src="js/script.js"></script>
</body>
</html>
